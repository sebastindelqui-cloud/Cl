name: Descargar datos de buses de Costa Rica

# Descarga el mapa de Costa Rica de OpenStreetMap (Geofabrik), saca todas las
# rutas y paradas de bus, las convierte al formato de la app y guarda el
# resultado en la rama "datos-buses". También revisa los datos abiertos de
# ARESEP y el CTP.
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/datos-buses.yml"
      - "web/tools/pbf-to-json.py"

permissions:
  contents: write

jobs:
  descargar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Herramientas
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool
          pip install --quiet osmium
      - name: Mapa de Costa Rica (Geofabrik)
        run: |
          mkdir -p out
          curl -sSfL --retry 4 --retry-delay 15 -A "RutaCR/1.0 (+https://github.com/${{ github.repository }})" \
            -o cr.osm.pbf https://download.geofabrik.de/central-america/costa-rica-latest.osm.pbf
          ls -la cr.osm.pbf
          osmium fileinfo -e cr.osm.pbf | grep -E "Timestamp|Number of" || true
      - name: Rutas y paradas de bus
        run: |
          osmium tags-filter cr.osm.pbf r/route=bus n/highway=bus_stop n/public_transport=platform,stop_position n/amenity=bus_station -o bus.osm.pbf
          python3 web/tools/pbf-to-json.py bus.osm.pbf out/osm-routes.json out/osm-stops.json
          node web/tools/osm-to-network.mjs out/osm-routes.json out/osm-stops.json out/cr-osm.json
          gzip -9 -k out/osm-routes.json out/osm-stops.json
      - name: Revisar ARESEP y CTP
        continue-on-error: true
        run: |
          probe() { echo "### $1"; curl -sSL --max-time 60 -A "Mozilla/5.0" "$1" | grep -oiE '(https?:)?//[^"'"'"' <>]*(wfs|wms|geoserver|arcgis|mapserver|featureserver|ows|download|descarga|\.zip|\.csv|\.json|\.xlsx|\.kml|\.shp|gtfs)[^"'"'"' <>]*' | sort -u | head -80; }
          {
            probe https://aresep.go.cr/datos-abiertos/rutas-autobuses/
            probe https://aresep.go.cr/transparencia/datos-abiertos
            probe https://www.ctp.go.cr/
            probe https://datosabiertos.mopt.go.cr/
          } > out/probe.txt 2>&1
          cat out/probe.txt
      - name: Guardar en la rama datos-buses
        run: |
          cd out
          git init -q -b datos-buses
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cr-osm.json osm-routes.json.gz osm-stops.json.gz probe.txt
          git commit -qm "Datos de buses de Costa Rica ($(date -u +%F))"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" datos-buses
