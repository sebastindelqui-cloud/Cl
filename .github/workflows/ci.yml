name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  core-tests:
    name: Pruebas del núcleo (swift test)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Versión de Swift
        run: swift --version
      - name: Pruebas unitarias de DualSoundCore
        run: swift test --package-path Core

  ios-build:
    name: Compilación de la app iOS (simulador)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Instalar XcodeGen
        run: brew install xcodegen
      - name: Generar proyecto
        run: xcodegen generate
      - name: Compilar
        run: |
          set -o pipefail
          xcodebuild build \
            -project DualSound.xcodeproj \
            -scheme DualSound \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            | tee build.log | grep -E "error:|warning:|BUILD" || true
          grep -q "BUILD SUCCEEDED" build.log
