name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  web-tests:
    name: Versión web (pruebas + extremo a extremo)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Pruebas unitarias
        run: npm test
      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium
      - name: Emisor + receptor en dos navegadores
        run: npm run e2e
      - name: Amplificador
        run: npm run e2e:amp
      - name: Mis Buses
        run: npm run e2e:buses

  core-tests:
    name: Pruebas del núcleo (swift test)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Versión de Swift
        run: swift --version
      - name: Pruebas unitarias de DualSoundCore
        run: swift test --package-path Core

  ios-build:
    name: Compilación de la app iOS (simulador)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Instalar XcodeGen
        run: brew install xcodegen
      - name: Generar proyecto
        run: xcodegen generate
      - name: Compilar
        run: |
          set -o pipefail
          xcodebuild build \
            -project DualSound.xcodeproj \
            -scheme DualSound \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            | tee build.log | grep -E "error:|warning:|BUILD" || true
          grep -q "BUILD SUCCEEDED" build.log
