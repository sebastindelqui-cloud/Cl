name: Publicar versión web

# Publica web/ en GitHub Pages cada vez que cambia en la rama principal.
# Requisito (una sola vez): Settings › Pages › Source: "GitHub Actions".
on:
  push:
    paths:
      - "web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Preparar el sitio
        run: |
          mkdir -p _site
          cp web/index.html web/app.js web/sync.js web/style.css web/amplificador.html web/amp.js web/amp-app.js web/buses.html web/buses.css web/buses-core.js web/buses-map.js web/buses-app.js web/config.js _site/
          mkdir -p _site/data && cp web/data/cr-network.json _site/data/
          cp -r web/vendor _site/vendor
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
